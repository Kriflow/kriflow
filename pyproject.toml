[project]
name = "kriflow"
version = "0.1.0"
description = "A swarm of Claude Code agents sharing one graphify memory per world"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28",
  "hypothesis>=6.150",
  "pillow==12.0.0",
  "pyright>=1.1.414",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "pytest-playwright>=0.10",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17",
  "types-pyyaml>=6.0",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
kriflow-kernel = { workspace = true }
kriflow-api = { workspace = true }
kriflow-worlds = { workspace = true }
kriflow-workflows = { workspace = true }
kriflow-runs = { workspace = true }
kriflow-connectors = { workspace = true }
kriflow-swarm = { workspace = true }
kriflow-memory = { workspace = true }
kriflow-learning = { workspace = true }
kriflow-notifications = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kriflow_*", "check_imports", "check_office_imports", "samples", "runs_fakes", "upgrade_record", "echo_server", "swarm_db", "sse", "scripted_app", "fake_graph", "wordmatch"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["packages", "apps/api", "tools", "tests", "connectors"]
exclude = ["**/node_modules", "**/.venv", "**/dist"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api", "tools", "connectors"]
pythonpath = ["tools"]
# -n 8: the suite mostly waits on polling intervals, so eight workers beat one even on a 4-core runner.
addopts = "-n 8 --cov=kriflow_kernel --cov=kriflow_worlds --cov=kriflow_workflows --cov=kriflow_runs --cov=kriflow_connectors --cov=kriflow_swarm --cov=kriflow_memory --cov=kriflow_learning --cov=kriflow_notifications --cov=kriflow_api --cov=check_imports --cov=check_office_imports --cov-fail-under=85 --cov-report=term-missing"

[tool.coverage.run]
core = "sysmon"
omit = ["*/tests/*"]
